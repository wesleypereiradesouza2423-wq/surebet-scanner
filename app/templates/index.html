<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surebet Server</title><style>:root{--card:#0e1a29;--line:#26394f;--text:#f5f8fc;--muted:#91a5bb;--green:#27d782;--blue:#4aa3ff}*{box-sizing:border-box}body{margin:0;background:#07101c;color:var(--text);font-family:system-ui,Segoe UI,Arial}.app{max-width:1200px;margin:auto;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0}.sub{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#142337;border-radius:12px;padding:11px}.metric span{font-size:11px;color:var(--muted);display:block}.metric b{font-size:18px}button{background:var(--blue);color:#fff;border:0;padding:10px 13px;border-radius:10px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.pos{color:var(--green);font-weight:900}.leg{margin-bottom:5px}a{color:#85c2ff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{overflow-x:auto}table{white-space:nowrap}}</style></head><body><div class="app"><div class="row"><div><h1>🎯 Surebet Server</h1><div class="sub">Coleta 24/7 • odds revalidadas • histórico em PostgreSQL</div></div><button onclick="scan()">Escanear agora</button></div><div class="card"><div class="grid"><div class="metric"><span>Surebets 24h</span><b id="count">—</b></div><div class="metric"><span>Melhor ROI 24h</span><b id="best">—</b></div><div class="metric"><span>ROI médio</span><b id="avg">—</b></div><div class="metric"><span>Último scan</span><b id="last">—</b></div></div></div><div class="card"><b>Surebets revalidadas nas últimas 24h</b><div class="wrap"><table><thead><tr><th>Hora</th><th>Esporte</th><th>Evento</th><th>ROI</th><th>Pernas</th><th>Lucro/R$1.000</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const pct=n=>Number(n).toFixed(2)+"%";const money=n=>"R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});async function refresh(){const[s,r]=await Promise.all([fetch("/api/stats").then(x=>x.json()),fetch("/api/latest?limit=100").then(x=>x.json())]);document.getElementById("count").textContent=s.stats?.surebets_24h??0;document.getElementById("best").textContent=pct(s.stats?.best_roi_24h??0);document.getElementById("avg").textContent=pct(s.stats?.avg_roi_24h??0);document.getElementById("last").textContent=s.last_scan?new Date(s.last_scan.scanned_at).toLocaleTimeString("pt-BR"):"—";document.getElementById("rows").innerHTML=r.length?r.map(x=>{const legs=(x.legs||[]).map(l=>`<div class="leg"><b>${l.name}</b> — ${l.book} @ ${Number(l.odd).toFixed(3)} — ${money(l.stake_for_1000)} ${l.link?`<a target="_blank" rel="noopener" href="${l.link}">Abrir</a>`:""}</div>`).join("");return `<tr><td>${new Date(x.recorded_at).toLocaleString("pt-BR")}</td><td>${x.sport_title}</td><td><b>${x.event_name}</b></td><td class="pos">${pct(x.roi)}</td><td>${legs}</td><td class="pos">${money(x.profit_per_1000)}</td></tr>`}).join(""):'<tr><td colspan="6">Ainda sem surebets revalidadas.</td></tr>'}async function scan(){await fetch("/api/scan",{method:"POST"});await refresh()}refresh();setInterval(refresh,30000);</script></body></html>
